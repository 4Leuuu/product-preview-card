<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="./styles.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
    rel="stylesheet"
  >
</head>
<body>
  <main>
    <picture>
      <source media="(min-width: 768px)"
        srcset="./images/image-product-desktop.jpg"
      >
      <img src="./images/image-product-mobile.jpg" alt="Bottle of Gabrielle Essence perfume by Chanel" width="350" height="342">
    </picture>
    <section>
      <span class="product-category">Perfume</span>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
      <div class="product-prices">
        <p class="product-price">$149.99</p>
        <s class="product-old-price">$169.99</s>
      </div>
      <button type="button"><img src="./images/icon-cart.svg" alt="" width="18" height="18"> Add to Cart</button>
    </section>
  </main>

</body>
</html>
